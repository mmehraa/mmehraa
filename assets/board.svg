<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="t">
  <title id="t">Departure board: MAYANK MEHRA. Express, web developer, platform 1. Departs now, India to anywhere.</title>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace; }
    .hi { font-family: "Nirmala UI", "Noto Sans Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", sans-serif; }
    .tile { fill: #1d1d1d; }
    .gap { stroke: #050505; stroke-width: 2; }
    .ch { font-size: 50px; font-weight: 700; fill: #ffb547; text-anchor: middle; }
    .scr { fill: #6b5a3a; }
    .real, .scr { transform-box: fill-box; transform-origin: center; animation-duration: 9s; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: ease-in-out; }
    .real { animation-name: flipIn; }
    .scr { animation-name: scramble; }
    @keyframes flipIn { 0% { opacity: 0; transform: scaleY(0); } 3% { opacity: 1; transform: scaleY(1.06); } 4% { transform: scaleY(1); } 92% { opacity: 1; transform: scaleY(1); } 95% { opacity: 0; transform: scaleY(0); } 100% { opacity: 0; transform: scaleY(0); } }
    @keyframes scramble { 0% { opacity: 1; } 2.5% { opacity: 0; } 94% { opacity: 0; } 96% { opacity: 1; } 100% { opacity: 1; } }
    .row { opacity: 0; animation: rowIn 9s ease-out infinite both; }
    @keyframes rowIn { 0%, 14% { opacity: 0; } 20%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .blink { animation: blink 1.4s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .real, .scr, .row, .blink { animation: none; opacity: 1; } .scr { opacity: 0; } }
  </style>

  <rect x="2" y="2" width="996" height="286" rx="18" fill="#0f0f0f" stroke="#2b2b2b" stroke-width="2"/>
  <text x="40" y="44" class="mono" font-size="14" letter-spacing="3" fill="#8c8c8c">INDIAN WEB RAILWAYS · DEPARTURES</text>
  <circle cx="842" cy="39" r="6" fill="#3ddc84" class="blink"/>
  <text x="858" y="44" class="mono" font-size="14" letter-spacing="3" fill="#3ddc84">ON TIME</text>

  <!-- MAYANK MEHRA: 12 split-flap tiles, 66px apart -->
  <g transform="translate(104 70)">
    <g transform="translate(0 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">Q</text><text class="mono ch real" x="29" y="58" style="animation-delay:0s">M</text></g>
    <g transform="translate(66 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">7</text><text class="mono ch real" x="29" y="58" style="animation-delay:.08s">A</text></g>
    <g transform="translate(132 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">K</text><text class="mono ch real" x="29" y="58" style="animation-delay:.16s">Y</text></g>
    <g transform="translate(198 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">2</text><text class="mono ch real" x="29" y="58" style="animation-delay:.24s">A</text></g>
    <g transform="translate(264 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">X</text><text class="mono ch real" x="29" y="58" style="animation-delay:.32s">N</text></g>
    <g transform="translate(330 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">5</text><text class="mono ch real" x="29" y="58" style="animation-delay:.40s">K</text></g>
    <g transform="translate(396 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/></g>
    <g transform="translate(462 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">W</text><text class="mono ch real" x="29" y="58" style="animation-delay:.56s">M</text></g>
    <g transform="translate(528 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">3</text><text class="mono ch real" x="29" y="58" style="animation-delay:.64s">E</text></g>
    <g transform="translate(594 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">B</text><text class="mono ch real" x="29" y="58" style="animation-delay:.72s">H</text></g>
    <g transform="translate(660 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">9</text><text class="mono ch real" x="29" y="58" style="animation-delay:.80s">R</text></g>
    <g transform="translate(726 0)"><rect class="tile" width="58" height="80" rx="6"/><line class="gap" x1="0" y1="40" x2="58" y2="40"/><text class="mono ch scr" x="29" y="58">F</text><text class="mono ch real" x="29" y="58" style="animation-delay:.88s">A</text></g>
  </g>

  <line x1="40" y1="182" x2="960" y2="182" stroke="#262626" stroke-width="2"/>

  <g class="row" style="animation-delay:.2s">
    <text x="40" y="218" class="mono" font-size="20" letter-spacing="2" fill="#eaeaea">EXPRESS · WEB DEVELOPER · PF 1</text>
    <text x="960" y="218" class="mono" font-size="20" letter-spacing="2" fill="#eaeaea" text-anchor="end">DEPARTS: NOW</text>
  </g>
  <g class="row" style="animation-delay:.5s">
    <text x="40" y="258" class="hi" font-size="22" font-weight="700" fill="#ffb547">मयंक मेहरा एक्सप्रेस</text>
    <text x="960" y="258" class="mono" font-size="16" letter-spacing="2" fill="#8c8c8c" text-anchor="end">INDIA → ANYWHERE</text>
  </g>
</svg>
