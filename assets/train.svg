<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" role="img" aria-label="A train running along the track. Thanks for riding. Next stop: your project.">
  <title>Thanks for riding. Next stop: your project.</title>
  <style>
    .train { animation: ride 11s linear infinite; }
    @keyframes ride { from { transform: translateX(-660px); } to { transform: translateX(1060px); } }
    .puff { transform-box: fill-box; transform-origin: center; animation: puff 1.1s ease-out infinite; }
    @keyframes puff { from { opacity: .8; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(-26px, -14px) scale(2); } }
    @media (prefers-reduced-motion: reduce) { .train, .puff { animation: none; } .train { transform: translateX(160px); } }
  </style>
