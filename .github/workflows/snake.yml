# Draws the contribution-graph snake shown on the profile README.
# Runs daily, on every push to main, and on demand (Actions tab → "Generate snake" → Run workflow).
# The SVGs are published to the `output` branch, which the README links to.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c2581f&color_dots=#ebedf0,#f5d9c4,#e8a87c,#d47a45,#c2581f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e58a52&color_dots=#161b22,#4a2a17,#7a3d1c,#b45a28,#e58a52

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
